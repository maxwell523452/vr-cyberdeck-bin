
name: Build Arch Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VR CyberDeck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build package in Arch Linux
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /tmp \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed git android-tools fuse2

              useradd -m builder
              mkdir -p /tmp/build
              cp /repo/PKGBUILD /tmp/build/PKGBUILD
              chown -R builder:builder /tmp/build

              runuser -u builder -- bash -euo pipefail -c "
                cd /tmp/build
                makepkg --cleanbuild --nodeps --noconfirm
              "

              cp /tmp/build/*.pkg.tar.zst /repo/
            '

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vr-cyberdeck-bin
          path: "*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 30
