name: publish pacman repository

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pacman-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download released packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repo/x86_64"

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            gh release download "$tag" \
              --pattern '*.pkg.tar.zst' \
              --dir "$RUNNER_TEMP/repo/x86_64" || true
          done < <(gh release list --limit 1000 --json tagName --jq '.[].tagName')

          find "$RUNNER_TEMP/repo/x86_64" -name '*.pkg.tar.zst' -print -quit | grep -q .

      - name: Generate repository database
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/repo:/repo" \
            -w /repo/x86_64 \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed pacman-contrib
              repo-add vr-cyberdeck.db.tar.gz ./*.pkg.tar.zst
              rm -f vr-cyberdeck.db
              cp vr-cyberdeck.db.tar.gz vr-cyberdeck.db
              rm -f vr-cyberdeck.files
            '

      - name: Publish repository assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pacman-repo"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Pacman repository" \
              --notes "Generated package repository database."
          fi

          gh release upload "$TAG" "$RUNNER_TEMP"/repo/x86_64/* \
            --clobber
