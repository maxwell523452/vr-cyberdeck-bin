name: update vr cyberdeck

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: vr-cyberdeck-upstream-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      version: ${{ steps.upstream.outputs.version }}
      exists: ${{ steps.upstream.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release="$(gh api repos/DeliciousMeatPop/VRCD/releases/latest)"
          tag="$(jq -er '.tag_name' <<< "$release")"

          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Unexpected upstream release tag: $tag"
            exit 1
          fi

          version="${tag#v}"
          asset="vr-cyberdeck-${version}-x86_64.AppImage"
          url="$(jq -er --arg asset "$asset" \
            '[.assets[] | select(.name == $asset)][0].browser_download_url' \
            <<< "$release")"
          expected_url="https://github.com/DeliciousMeatPop/VRCD/releases/download/${tag}/${asset}"

          if [[ "$url" != "$expected_url" ]]; then
            echo "::error::Unexpected upstream download URL"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New upstream release: $tag"
          fi

      - name: Prepare and validate package
        if: steps.upstream.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-sources

          asset="vr-cyberdeck-${VERSION}-x86_64.AppImage"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/DeliciousMeatPop/VRCD/releases/download/v${VERSION}/${asset}" \
            -o "build-sources/${asset}"

          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/DeliciousMeatPop/VRCD/archive/refs/tags/v${VERSION}.tar.gz" \
            -o "build-sources/v${VERSION}.tar.gz"

          app_sha="$(sha256sum "build-sources/${asset}" | cut -d' ' -f1)"
          src_sha="$(sha256sum "build-sources/v${VERSION}.tar.gz" | cut -d' ' -f1)"

          python3 - "$VERSION" "$app_sha" "$src_sha" <<'PY'
          import re
          import sys
          from pathlib import Path

          version, app_sha, src_sha = sys.argv[1:]
          path = Path("PKGBUILD")
          data = path.read_text()

          def replace_one(pattern, replacement, content, name):
              updated, count = re.subn(
                  pattern, replacement, content, count=1, flags=re.M
              )
              if count != 1:
                  raise SystemExit(f"Could not update {name}")
              return updated

          data = replace_one(r"^pkgver=.*$", f"pkgver={version}", data, "pkgver")
          data = replace_one(r"^pkgrel=.*$", "pkgrel=1", data, "pkgrel")

          sums = f"sha256sums=('{app_sha}'\n            '{src_sha}')"
          data, count = re.subn(
              r"sha256sums=\(.*?\)", lambda _: sums, data, count=1, flags=re.S
          )
          if count != 1:
              raise SystemExit("Could not update sha256sums")

          path.write_text(data)
          PY

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed pacman-contrib
              namcap PKGBUILD
              bash -n PKGBUILD
            '

      - name: Upload prepared inputs
        if: steps.upstream.outputs.exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-inputs
          path: |
            PKGBUILD
            build-sources/*
          if-no-files-found: error
          retention-days: 1

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download prepared inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-inputs
          path: prepared

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /tmp \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed git android-tools fuse2

              useradd -m builder
              mkdir -p /tmp/build /tmp/sources
              cp /repo/prepared/PKGBUILD /tmp/build/
              cp -a /repo/prepared/build-sources/. /tmp/sources/
              chown -R builder:builder /tmp/build /tmp/sources

              runuser -u builder -- bash -euo pipefail -c "
                export SRCDEST=/tmp/sources
                cd /tmp/build
                makepkg --cleanbuild --nodeps --noconfirm
              "

              cp /tmp/build/*.pkg.tar.zst /repo/
            '

          test -n "$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-package
          path: "*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [check, build]
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download prepared PKGBUILD
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prepared-inputs
          path: prepared-inputs

      - name: Download package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: built-package
          path: built-package

      - name: Commit PKGBUILD and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          cp prepared-inputs/PKGBUILD PKGBUILD

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- PKGBUILD; then
            git add PKGBUILD
            git commit -m "chore: update VR CyberDeck to $VERSION"
            git push origin HEAD:main
          fi

          package="$(find built-package -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
          test -n "$package"

          gh release create "$TAG" "$package" \
            --verify-tag=false \
            --title "VR CyberDeck $TAG" \
            --notes "Upstream release: https://github.com/DeliciousMeatPop/VRCD/releases/tag/${TAG}"
